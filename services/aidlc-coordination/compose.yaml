services:
  aidlc-coordination:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - aidlc-coordination-data:/data
    environment:
      MCP_STATE_DATABASE: sqlite
      MCP_STATE_SQLITE_PATH: /data/mcp-state.db
      MCP_STATE_AUTH_TOKEN: ${MCP_STATE_AUTH_TOKEN:?set MCP_STATE_AUTH_TOKEN in .env before starting the service}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    profiles: [postgres, fleet]
    environment:
      POSTGRES_DB: aidlc
      POSTGRES_USER: aidlc
      POSTGRES_PASSWORD: ${MCP_POSTGRES_PASSWORD:?set MCP_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidlc -d aidlc"]
      interval: 5s
      timeout: 3s
      retries: 20

  fleet-coordination:
    profiles: [fleet]
    build: .
    ports:
      - "${MCP_FLEET_BIND_ADDRESS:-127.0.0.1}:${MCP_FLEET_PORT:-8788}:8787"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MCP_STATE_DATABASE: postgres
      MCP_STATE_POSTGRES_URL: postgres://aidlc:${MCP_POSTGRES_PASSWORD:?set MCP_POSTGRES_PASSWORD in .env}@postgres:5432/aidlc
      MCP_FLEET_ENABLED: "1"
      MCP_FLEET_LEAD_TOKEN: ${MCP_FLEET_LEAD_TOKEN:?set MCP_FLEET_LEAD_TOKEN in .env}
      MCP_FLEET_REVIEWER_TOKEN: ${MCP_FLEET_REVIEWER_TOKEN:?set MCP_FLEET_REVIEWER_TOKEN in .env}
      MCP_FLEET_WORKER_TOKENS: ${MCP_FLEET_WORKER_TOKENS:?set MCP_FLEET_WORKER_TOKENS JSON in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  aidlc-coordination-data:
  postgres-data:
